[project]
name = "my_research_agent"
version = "0.1.0"
description = "my_research_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "crewai[google-genai]==1.9.3",
    "crewai-tools==1.9.3",
    "langchain-google-genai==4.2.2",
    "python-dotenv==1.1.1",
    "streamlit==1.57.0",
    "pydantic==2.11.10"
]

[project.scripts]
my_research_agent = "my_research_agent.main:run"
run_crew = "my_research_agent.main:run"
train = "my_research_agent.main:train"
replay = "my_research_agent.main:replay"
test = "my_research_agent.main:test"
run_with_trigger = "my_research_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"